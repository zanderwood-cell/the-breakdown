name: Publish Weekly Newsletter

on:
  schedule:
    - cron: '0 7 * * 2'  # Tuesday 7am UTC

  workflow_dispatch:

jobs:

  # Runs automatically — generates the newsletter and posts a preview summary.
  # You will get a GitHub email asking you to approve the publish job.
  generate:
    name: Generate Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Generate newsletter preview
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GENERATE_ONLY: 'true'
        run: python newsletter_agent.py
      - name: Upload preview for publish job
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-preview
          path: newsletter_preview.json
          retention-days: 7

  # Waits for your approval before running.
  # GitHub emails you a link — click Approve and it publishes + posts to social.
  publish:
    name: Publish to Substack
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Download preview
        uses: actions/download-artifact@v4
        with:
          name: newsletter-preview
      - name: Publish newsletter
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUBSTACK_EMAIL:       ${{ secrets.SUBSTACK_EMAIL }}
          SUBSTACK_PASSWORD:    ${{ secrets.SUBSTACK_PASSWORD }}
          SUBSTACK_SUBDOMAIN:   ${{ secrets.SUBSTACK_SUBDOMAIN }}
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME:      ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD:      ${{ secrets.REDDIT_PASSWORD }}
          BLUESKY_HANDLE:       ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python newsletter_agent.py
      - name: Upload fallback on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-fallback
          path: fallback_*.html
          if-no-files-found: ignore
